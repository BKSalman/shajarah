[package]
name = "web"
version = "0.1.0"
authors = ["Salman Abuhaimed <salman.f.abuhaimed@gmail.com>"]
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
shared = { path = "../shared" }

dioxus = { version = "0.7.9", features = ["router", "fullstack"] }
# https://github.com/DioxusLabs/dioxus/issues/4765
dioxus-html = { version = "0.7.9", features = ["serialize"] }
axum = { version = "0.8.4", features = ["macros", "multipart"], optional = true }
tokio = { version = "1", features = [ "fs", "io-std", "io-util", "macros", "net", "parking_lot", "process", "rt", "rt-multi-thread", "signal" ], optional = true }
tower-http = { version = "0.6.6", features = ["cors", "limit", "fs"], optional = true }
serde = { workspace = true }
serde_json = { workspace = true }
chrono = { workspace = true }
indexmap = { workspace = true }
sqlx = { version = "0.9", features = [ "runtime-tokio", "tls-rustls", "postgres", "chrono", "uuid" ], optional = true }
garde = { version = "0.23.0", features = ["derive", "email"] }
uuid = { version = "1.18.0", features = ["serde", "v4"] }
thiserror = "2.0.14"
tower-cookies = { version = "0.11.0", optional = true, features = ["private"] }
tracing = "0.1.41"
rand = { version = "0.9.2", optional = true }
argon2 = { version = "0.5.3", optional = true }
async-trait = { version = "0.1.88", optional = true }
base64 = "0.22.1"
toml = { version = "0.9.5", optional = true }
url = { version = "2.5.4", optional = true, features = ["serde"] }
aes-gcm = { version = "0.10.3", optional = true }
csv = { version = "1.3.1", optional = true }
tower = "0.5.2"
anyhow = { workspace = true }
http = "1.4.0"
gloo-timers = { version = "0.4.0", features = ["futures"] }
futures = "0.3.32"
dioxus-primitives = { git = "https://github.com/DioxusLabs/components", version = "0.0.1", default-features = false }
dioxus-icons = { version = "0.1.0", default-features = false }

[target.wasm32-unknown-unknown.dependencies]
uuid = { version = "1.18.0", features = ["serde", "v4", "js"] }
gui = { path = "../gui" }


[features]
default = ["web"]
# The feature that are only required for the web = ["dioxus/web"] build target should be optional and only enabled in the web = ["dioxus/web"] feature
web = ["dioxus/web"]
# The feature that are only required for the desktop = ["dioxus/desktop"] build target should be optional and only enabled in the desktop = ["dioxus/desktop"] feature
desktop = ["dioxus/desktop"]
# The feature that are only required for the mobile = ["dioxus/mobile"] build target should be optional and only enabled in the mobile = ["dioxus/mobile"] feature
mobile = ["dioxus/mobile"]
server = [
  "dioxus/server",
  "dep:axum",
  "dep:tokio",
  "dep:tower-http",
  "dep:sqlx",
  "dep:tower-cookies",
  "dep:rand",
  "dep:argon2",
  "dep:async-trait",
  "dep:toml",
  "dep:url",
  "dep:aes-gcm",
  "dep:csv"
]
