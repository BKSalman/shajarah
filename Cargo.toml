[workspace]
members = ["web", "gui", "shared"]
resolver = "3"

[workspace.package]

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
indexmap = { version = "2.3.0", features = ["serde"] }
jiff = { version = "0.2.35", features = ["serde", "js"] }
anyhow = "1"
web-sys = { version = "0.3.77", features = [
    "Element",
    "ScrollIntoViewOptions",
    "ScrollBehavior", 
    "ScrollLogicalPosition"
] }

[profile.release]
opt-level = "z"
lto = "fat"
codegen-units = 1
strip = true
panic = "abort"

[profile.dev]
debug = "line-tables-only"
split-debuginfo = "unpacked"

[profile.dev.build-override]
opt-level = 0
debug = false

# Only the crates that make the egui canvas unusable at opt-level 0:
[profile.dev.package.egui]
opt-level = 2
[profile.dev.package.epaint]
opt-level = 2
[profile.dev.package.eframe]
opt-level = 2
[profile.dev.package.glow]
opt-level = 2
[profile.dev.package.ar-reshaper]
opt-level = 2
[profile.dev.package.unicode-bidi]
opt-level = 2
[profile.dev.package.image]
opt-level = 3
[profile.dev.package.png]
opt-level = 3
[profile.dev.package.zune-jpeg]
opt-level = 3
[profile.dev.package.image-webp]
opt-level = 3

[patch.crates-io]
